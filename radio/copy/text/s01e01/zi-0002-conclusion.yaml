# s01e01 character 2 conclusion -- short wrap-up of 不 (character, words, sentences), rough draft v1
# Written by Claude in the style of zi-0001-conclusion; unedited, for Rob's review. No hanzi in Rob lines; no daughter mention.
# Follows zi-0002-sentences. Episode-level sign-off lives in outro.yaml.
- speaker: Rob
  text: "Okay, that one we should review. Quick recap?"

- speaker: Sunshine
  text: "Sure. Our second character was \"Bù.\" Fourth tone, and it means \"not\" or \"no.\""

- speaker: Rob
  text: "And it gave us two words that matter. \"Is not,\" and \"is it or isn't it,\" for asking yes-or-no questions."

- speaker: Sunshine
  text: "[warmly] And the fourth one, the \"fault\" word, is the one you can safely forget for now."

- speaker: Rob
  text: "[dryly] Already forgotten. And in the sentences, one little word at the end changed the mood three different ways."

- speaker: Sunshine
  text: "[laughs] And you survived the market."

- speaker: Rob
  text: "Barely. But now I can say no, and mean it."
